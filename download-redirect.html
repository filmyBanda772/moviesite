    <script>
        // URL se link nikalna
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');
        const finalBtn = document.getElementById('finalDownloadBtn');

        if(targetUrl) {
            finalBtn.href = targetUrl;
        } else {
            finalBtn.innerText = "Link Error - Go Back";
            finalBtn.style.backgroundColor = "gray";
        }

        // Continue Button ka magic
        document.getElementById('continueBtn').addEventListener('click', function() {
            // Button ko chupao
            this.style.display = 'none';
            // Scroll message dikhao
            document.getElementById('scrollMessage').style.display = 'block';
            // Sabse niche wala download section on karo
            document.getElementById('bottomSection').style.display = 'block';
            
            // User ko thoda sa niche scroll karwao taaki use pata chale ki aage badhna hai
            window.scrollBy({ top: 300, behavior: 'smooth' });
        });
    </script>
